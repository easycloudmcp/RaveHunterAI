[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ravehunter-ai"
version = "0.4.0a0"
description = "Local-first event discovery and intelligence prototype"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4==4.15.0",
    "playwright==1.61.0",
    "rich==15.0.0",
    "streamlit==1.59.1",
]

[project.optional-dependencies]
test = [
    "pytest==9.1.1",
    "build==1.5.0",
    "mypy==2.3.0",
    "ruff==0.16.0",
]

[project.scripts]
ravehunter = "ravehunter.cli:main"

[tool.ruff]
line-length = 88
extend-exclude = [
    "collectors",
    "database/Delete_models.py",
    "models",
    "repositories/instagram_repository.py",
    "services",
    "tests/instagram",
    "tests/test_classify_prompt.py",
    "tests/test_event.py",
    "tests/test_extract_prompt.py",
    "tests/test_packaging.py",
    "tests/test_system_prompt.py",
]

[tool.ruff.lint]
ignore = ["FLY002", "RUF012"]

[tool.mypy]
python_version = "3.11"
packages = ["ravehunter"]
ignore_missing_imports = true
follow_imports = "skip"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
where = ["."]
include = [
    "ravehunter*",
    "collectors*",
    "config*",
    "database*",
    "discovery*",
    "models*",
    "repositories*",
    "services*",
]
namespaces = true

[tool.setuptools.data-files]
"share/ravehunter/prompts" = ["prompts/*.md"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
